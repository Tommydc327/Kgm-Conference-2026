<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Kingdom Conference 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- LOGIN VIEW -->
<div class="admin-login-page" id="loginView">
  <div class="admin-login-box fade-in">
    <div class="admin-login-header">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#C9A227" stroke-width="1.75"><rect x="4" y="10" width="16" height="10" rx="1"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      <p class="font-display" style="font-size:24px; margin:8px 0 0;">Staff Admin</p>
      <p id="loginProgramName"></p>
    </div>
    <form class="admin-card" id="loginForm">
      <label class="field-label" for="adminEmail">Admin Email</label>
      <input class="field-input" style="margin-bottom:16px;" type="email" id="adminEmail" autocomplete="username" />
      <label class="field-label" for="adminPassword">Admin Password</label>
      <input class="field-input" type="password" id="adminPassword" autocomplete="current-password" />
      <p class="field-error hidden" id="loginError"></p>
      <button type="submit" class="submit-btn" style="margin-top:20px;" id="loginBtn">Enter</button>
    </form>
    <a class="back-link" href="index.html">Back to registration</a>
  </div>
</div>

<!-- DASHBOARD VIEW -->
<div class="hidden" id="dashboardView">
  <header class="admin-header">
    <div>
      <div class="admin-eyebrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Admin Dashboard
      </div>
      <h1 class="admin-title" id="dashProgramName"></h1>
    </div>
    <div class="admin-actions">
      <button class="btn-outline" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Refresh
      </button>
      <button class="btn-quiet" id="logoutBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Log out
      </button>
    </div>
  </header>

  <main class="admin-main">
    <div class="loading-block" id="loadingBlock">
      <svg class="spin" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p style="font-size:14px; margin-top:12px;">Loading registrations…</p>
    </div>

    <div id="dashContent" class="hidden">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="branch-panel">
        <p class="branch-panel-label">Registrants by Branch</p>
        <div class="branch-cols" id="branchCols"></div>
      </div>

      <div class="filters">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input class="search-input" id="searchInput" placeholder="Search name or phone" />
        </div>
        <select class="filter-select" id="filterGender">
          <option value="">All Genders</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
        <select class="filter-select" id="filterWorker">
          <option value="">All Categories</option>
          <option value="Worker">Worker</option>
          <option value="Non-worker">Non-worker</option>
        </select>
        <select class="filter-select" id="filterBranch">
          <option value="">All Branches</option>
        </select>
        <button class="export-btn" id="exportBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Export CSV
        </button>
      </div>

      <div class="table-panel">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>#</th><th>Name</th><th>Phone</th><th>Gender</th><th>Category</th><th>Branch</th><th>Registered</th><th></th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
      <p class="table-footnote" id="tableFootnote"></p>
    </div>
  </main>
</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay hidden" id="deleteModal">
  <div class="modal">
    <h3>Remove registrant?</h3>
    <p id="deleteModalText"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelDeleteBtn">Cancel</button>
      <button class="btn-danger" id="confirmDeleteBtn">Remove</button>
    </div>
  </div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
